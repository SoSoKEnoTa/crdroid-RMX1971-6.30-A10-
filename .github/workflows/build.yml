container_build_job:
  compute_engine_instance:
    image_project: ubuntu-os-cloud
    image_family: ubuntu-2204-lts
    platform: linux
    cpu: 8
    memory: 24G
    disk: 160 # Гарантированное выделение пространства под тяжелую компиляцию

  build_script:
    - sudo apt-get update
    - sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 libncurses5 python2 patchelf
    - mkdir -p $HOME/android && cd $HOME/android
    - git config --global user.name "AI Build Bot"
    - git config --global user.email "bot@ai.internal"
    - echo "=== СКАЧИВАНИЕ ИСХОДНИКОВ В СРЕДУ С 160 ГБ ДИСКА ==="
    - git clone https://github.com -b 10.0 --depth=1 .
    - git clone https://github.com -b lineage-17.1 --depth=1 device/realme/spy
    - git clone https://github.com -b lineage-17.1 --depth=1 device/realme/sdm710-common
    - git clone https://github.com -b lineage-17.1 --depth=1 kernel/realme/sdm710
    - git clone https://github.com -b lineage-17.1 --depth=1 vendor/realme
    - git clone https://github.com -b lineage-17.1 --depth=1 device/qcom/sepolicy
    - git clone https://github.com -b lineage-17.1 --depth=1 hardware/interfaces
    - echo "=== НАСТРОЙКА VANILLA-КОНФИГУРАЦИИ СИСТЕМЫ ==="
    - cd device/realme/spy
    - echo "TARGET_GAPPS_ARCH := arm64" >> BoardConfig.mk
    - echo "WITH_GAPPS := false" >> BoardConfig.mk
    - echo "TARGET_CPU_VARIANT := kryo300" >> BoardConfig.mk
    - cd $HOME/android
    - VENDOR_DIR=$(find vendor -maxdepth 2 -type d -name "crdroid" -o -name "cm" -o -name "lineage" | head -n 1)
    - mkdir -p $VENDOR_DIR/config
    - echo "PRODUCT_PROPERTY_OVERRIDES += ro.crdroid.version=6.30" >> $VENDOR_DIR/config/common.mk
    - echo "PRODUCT_PROPERTY_OVERRIDES += ro.modversion=crDroidAndroid-10.0-6.30" >> $VENDOR_DIR/config/common.mk
    - echo "=== ЗАПУСК ВЕЛИКОЙ КОМПИЛЯЦИИ MKA BACON ==="
    - source build/envsetup.sh
    - lunch crdroid_spy-userdebug
    - mka bacon -j$(nproc --all)
    - echo "=== СБОРКА ЗАВЕРШЕНА. ВЫГРУЗКА РЕАЛЬНОЙ ПРОШИВКИ ==="
    - curl -T out/target/product/spy/crDroid*.zip https://bashupload.com
