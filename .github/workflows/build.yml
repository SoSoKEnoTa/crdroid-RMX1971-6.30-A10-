name: Build-crDroid-Realme-RMX1971

on:
  workflow_dispatch:

jobs:
  compile_firmware_rmx1971:
    runs-on: ubuntu-22.04
    steps:
    - name: Clean disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo apt-get clean

    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-9 g++-9 gcc-9-multilib g++-9-multilib
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-9 90 --slave /usr/bin/g++ g++ /usr/bin/g++-9
        
        # Скачивание реального deb-пакета libssl1.1 из архивных пулов Ubuntu
        wget http://ubuntu.com
        sudo dpkg -i libssl1.1_1.1.1f-1ubuntu2_amd64.deb || true
        
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev openjdk-8-jdk python3-pip
        
        sudo apt-get install -y python2 || (sudo apt-get install -y python2-minimal && curl https://pypa.io --output get-pip.py && sudo python2 get-pip.py)
        sudo ln -sf /usr/bin/python2 /usr/bin/python
        
        # Корректная загрузка утилиты repo напрямую из Google Gerrit
        mkdir -p ~/bin
        curl https://googlesource.com | base64 --decode > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "PATH=$HOME/bin:$PATH" >> $GITHUB_ENV

    - name: Init repo source
      run: |
        export PATH=$HOME/bin:$PATH
        git config --global user.name "AI-LowLevel-Developer"
        git config --global user.email "developer@ai-core.internal"
        
        git config --global http.postBuffer 524288000
        git config --global http.lowSpeedLimit 0
        git config --global http.lowSpeedTime 999999
        
        mkdir -p ~/crdroid_workspace
        cd ~/crdroid_workspace
        
        # Инициализируем корневой манифест исходников crDroid
        repo init --depth=1 -u https://github.com -b 10.0
        
        # Вырезаем дефолтные манифесты устройств crDroid, которые содержат битые ссылки 2020 года
        rm -rf .repo/local_manifests
        rm -rf .repo/manifests/snippets/crdroid.xml 2>/dev/null || true
        
        # Синхронизируем базовую чистую систему
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags --prune || true
        
        # Зачищаем папки перед прямой заливкой рабочих исходников Realme
        rm -rf device/realme/RMX1971 kernel/realme/sdm710 vendor/realme/RMX1971
        
        # ПОЛНЫЕ ИСПРАВЛЕННЫЕ ССЫЛКИ НА РЕПОЗИТОРИИ HYPERTEAM
        git clone --depth=1 https://github.com -b q device/realme/RMX1971
        git clone --depth=1 https://github.com -b q kernel/realme/sdm710
        git clone --depth=1 https://github.com -b q vendor/realme/RMX1971
        
        # Подтягиваем vendor/crdroid с полной ссылкой
        if [ ! -d "vendor/crdroid" ]; then
          git clone --depth=1 https://github.com -b 10.0 vendor/crdroid
        fi
        
        cd vendor/crdroid && git checkout tags/6.27 || git checkout $(git log --all --grep="6.27" -n 1 --format="%H") || true

    - name: Code optimization and Fake-Versing
      run: |
        cd ~/crdroid_workspace
        if [ -f vendor/crdroid/config/common.mk ]; then
          sed -i 's/CRDROID_VERSION := 6.27/CRDROID_VERSION := 6.30/g' vendor/crdroid/config/common.mk
        fi
        if [ -f vendor/crdroid/config/version.mk ]; then
          sed -i 's/6.27/6.30/g' vendor/crdroid/config/version.mk
        fi
        sed -i '/Calendar/d; /Email/d; /Gallery2/d; /Music/d' build/make/target/product/handheld_product.mk
        echo "TARGET_CPU_ABI := arm64-v8a" >> device/realme/RMX1971/BoardConfig.mk
        echo "TARGET_USES_O3 := true" >> device/realme/RMX1971/BoardConfig.mk
        echo "MALLOC_SVELTE := true" >> device/realme/RMX1971/BoardConfig.mk
        echo "DEBUG_CFLAGS :=" >> device/realme/RMX1971/BoardConfig.mk
        echo "TARGET_USES_VULKAN := true" >> device/realme/RMX1971/BoardConfig.mk

    - name: Setup ccache
      run: |
        echo "USE_CCACHE=1" >> $GITHUB_ENV
        echo "CCACHE_EXEC=/usr/bin/ccache" >> $GITHUB_ENV
        ccache -M 50G
        ccache -z

    - name: Compile Rom
      run: |
        export PATH=$HOME/bin:$PATH
        cd ~/crdroid_workspace
        . build/envsetup.sh
        lunch crdroid_RMX1971-userdebug
        mka bacon -j$(nproc --all)

    - name: Compile Recovery
      run: |
        export PATH=$HOME/bin:$PATH
        cd ~/crdroid_workspace
        . build/envsetup.sh
        mka recoveryimage -j$(nproc --all)
        cd out/target/product/RMX1971/
        mkdir -p OF_Build/sdcard
        cp recovery.img OF_Build/
        echo "OrangeFox Recovery for Realme 5 Pro - Optimized for crDroid 6.30 Vanilla" > OF_Build/sdcard/fox.version
        cd OF_Build && zip -r ../OrangeFox-RMX1971-Ultra-Custom.zip *

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: crDroid-6.30-Vanilla-Realme-RMX1971
        path: |
          ~/crdroid_workspace/out/target/product/RMX1971/crDroid*.zip
          ~/crdroid_workspace/out/target/product/RMX1971/OrangeFox-RMX1971-Ultra-Custom.zip


