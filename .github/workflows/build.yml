name: 'Ultra-Performance crDroid 6.30 Vanilla for Realme 5 Pro (RMX1971)'

on:
  workflow_dispatch:

jobs:
  compile_firmware_rmx1971:
    runs-on: ubuntu-20.04
    steps:
    - name: 'Оптимизация дискового пространства раннера GitHub'
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 2048
        swap-size-mb: 16384
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'

    - name: 'Настройка окружения сборщика и низкоуровневых утилит'
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.1-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev openjdk-8-jdk python2 python3-pip
        sudo ln -sf /usr/bin/python2 /usr/bin/python
        mkdir -p ~/bin
        curl https://googleapis.com > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "PATH=$HOME/bin:$PATH" >> $GITHUB_ENV

    - name: 'Инициализация репозиториев crDroid 6.27 и манифестов RMX1971'
      run: |
        export PATH=$HOME/bin:$PATH
        git config --global user.name "AI-LowLevel-Developer"
        git config --global user.email "developer@ai-core.internal"
        
        mkdir -p ~/crdroid_workspace
        cd ~/crdroid_workspace
        
        # Инициализация манифеста crDroid 10.0
        repo init --depth=1 -u https://github.com -b 10.0
        
        # Клонирование дерева устройства, ядер Snapdragon и вендора для RMX1971 / RMX1973
        git clone https://github.com -b 10.0 device/realme/RMX1971
        git clone https://github.com -b 10.0 kernel/realme/sdm710
        git clone https://github.com -b 10.0 vendor/realme/RMX1971
        
        # Фиксация исходного кода на стабильной версии 6.27
        cd vendor/crdroid && git checkout tags/6.27 || git checkout $(git log --all --grep="6.27" -n 1 --format="%H") || true
        cd ~/crdroid_workspace

    - name: 'Низкоуровневый тюнинг Qualcomm Snapdragon, ребрендинг в 6.30 и Ultra-Vanilla'
      run: |
        cd ~/crdroid_workspace
        
        # ХАК: Принудительный ребрендинг версии прошивки с 6.27 на 6.30 в конфигурациях компилятора
        if [ -f vendor/crdroid/config/common.mk ]; then
          sed -i 's/CRDROID_VERSION := 6.27/CRDROID_VERSION := 6.30/g' vendor/crdroid/config/common.mk
        fi
        if [ -f vendor/crdroid/config/version.mk ]; then
          sed -i 's/6.27/6.30/g' vendor/crdroid/config/version.mk
        fi
        
        # Глубокая очистка системы от встроенного софта под чистую установку NikGApps
        sed -i '/Calendar/d' build/make/target/product/handheld_product.mk
        sed -i '/Email/d' build/make/target/product/handheld_product.mk
        sed -i '/Gallery2/d' build/make/target/product/handheld_product.mk
        sed -i '/Music/d' build/make/target/product/handheld_product.mk
        
        # Специфические низкоуровневые флаги оптимизации для Qualcomm Snapdragon 712 (Kryo 360)
        echo "TARGET_CPU_ABI := arm64-v8a" >> device/realme/RMX1971/BoardConfig.mk
        echo "TARGET_USES_O3 := true" >> device/realme/RMX1971/BoardConfig.mk
        echo "MALLOC_SVELTE := true" >> device/realme/RMX1971/BoardConfig.mk
        echo "DEBUG_CFLAGS :=" >> device/realme/RMX1971/BoardConfig.mk
        
        # Активация аппаратного ускорения графического движка Skia через Vulkan API
        echo "TARGET_USES_VULKAN := true" >> device/realme/RMX1971/BoardConfig.mk

    - name: 'Настройка ccache (Ускорение компиляции)'
      run: |
        echo "USE_CCACHE=1" >> $GITHUB_ENV
        echo "CCACHE_EXEC=/usr/bin/ccache" >> $GITHUB_ENV
        ccache -M 50G
        ccache -z

    - name: 'Запуск компиляции прошивки crDroid 6.30 для Realme (mka bacon)'
      run: |
        export PATH=$HOME/bin:$PATH
        cd ~/crdroid_workspace
        . build/envsetup.sh
        lunch crdroid_RMX1971-userdebug
        
        # Компиляция прошивки со всеми доступными ядрами процессора
        mka bacon -j$(nproc --all)

    - name: 'Компиляция кастомного OrangeFox Recovery для RMX1971'
      run: |
        export PATH=$HOME/bin:$PATH
        cd ~/crdroid_workspace
        . build/envsetup.sh
        
        # Сборка кастомного образа рекавери для архитектуры sdm710
        mka recoveryimage -j$(nproc --all)
        
        # Упаковка OrangeFox в flash-совместимый ZIP
        cd out/target/product/RMX1971/
        mkdir -p OF_Build/sdcard
        cp recovery.img OF_Build/
        echo "OrangeFox Recovery for Realme 5 Pro - Optimized for crDroid 6.30 Vanilla" > OF_Build/sdcard/fox.version
        cd OF_Build && zip -r ../OrangeFox-RMX1971-Ultra-Custom.zip *

    - name: 'Экспорт готовой прошивки crDroid 6.30 для Realme'
      uses: actions/upload-artifact@v4
      with:
        name: crDroid-6.30-Vanilla-Ultra-Optimized-RMX1971
        path: ~/crdroid_workspace/out/target/product/RMX1971/crDroid*.zip

    - name: 'Экспорт кастомного OrangeFox Recovery для Realme'
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox-Recovery-Ultra-RMX1971
        path: ~/crdroid_workspace/out/target/product/RMX1971/OrangeFox-RMX1971-Ultra-Custom.zip
