name: Android AI Self-Healing Core (crDroid 6.30 - RMX1971)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build_bot:
    runs-on: ubuntu-24.04
    steps:
    - name: 1. Инициализация репозитория бота
      uses: actions/checkout@v4

    - name: 2. Максимальная очистка диска под сборку AOSP
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /usr/share/swift /usr/local/lib/node_modules
        sudo apt-get clean
        df -h

    - name: 3. Развертывание и адаптация низкоуровневого окружения
      run: |
        sudo chmod 777 /etc/resolv.conf
        echo -e "nameserver 8.8.8.8\nnameserver 1.1.1.1" > /etc/resolv.conf
        
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 libncurses6 libncurses-dev patchelf
        
        sudo ln -sf /usr/bin/python3 /usr/bin/python
        
        # ЛОКАЛЬНЫЙ ФИКС БЕЗ СКАЧИВАНИЙ: Перенаправляем вызовы на системную libncurses6
        sudo ln -sf /lib/x86_64-linux-gnu/libncurses.so.6 /usr/lib/libncurses.so.5
        sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/libtinfo.so.5
        sudo ln -sf /lib/x86_64-linux-gnu/libncurses.so.6 /usr/lib/libtinfo.so.6

        # Автоматическая генерация изолированного скрипта Repo
        mkdir -p $HOME/bin
        printf '%s\n' \
          '#!/usr/bin/env python' \
          'import os, sys, subprocess' \
          'def main():' \
          '    repo_dir = os.path.expanduser("~/.repo/repo")' \
          '    main_py = os.path.join(repo_dir, "main.py")' \
          '    if not os.path.exists(main_py):' \
          '        os.makedirs(os.path.expanduser("~/.repo"), exist_ok=True)' \
          '        subprocess.run(["git", "clone", "https://github.com", repo_dir, "--depth=1"], check=True)' \
          '    os.execv(sys.executable, [sys.executable, main_py] + sys.argv[1:])' \
          'if __name__ == "__main__":' \
          '    main()' > $HOME/bin/repo
        chmod a+x $HOME/bin/repo
        sudo ln -sf $HOME/bin/repo /usr/bin/repo
        
        git config --global user.name "AI Lowlevel Engine"
        git config --global user.email "core-engine@ai-android.internal"

    - name: 4. Инициализация исходников crDroid (Android 10)
      run: |
        mkdir -p $HOME/android
        cd $HOME/android
        repo init -u https://github.com -b 10.0 --git-lfs --depth=1

    - name: 5. Инжекция вечных манифестов LineageOS
      run: |
        mkdir -p $HOME/android/.repo/local_manifests
        cat <<EOF > $HOME/android/.repo/local_manifests/spy.xml
        <?xml version="1.0" encoding="UTF-8"?>
        <manifest>
          <remove-project name="LineageOS/android_device_qcom_sepolicy" />
          <project name="LineageOS/android_device_qcom_sepolicy" path="device/qcom/sepolicy" remote="github" revision="lineage-17.1" />
          <project name="LineageOS/android_device_realme_spy" path="device/realme/spy" remote="github" revision="lineage-17.1" />
          <project name="LineageOS/android_device_realme_sdm710-common" path="device/realme/sdm710-common" remote="github" revision="lineage-17.1" />
          <project name="LineageOS/android_kernel_realme_sdm710" path="kernel/realme/sdm710" remote="github" revision="lineage-17.1" />
          <project name="TheMuppets/proprietary_vendor_realme" path="vendor/realme" remote="github" revision="lineage-17.1" />
          <project name="LineageOS/android_hardware_interfaces" path="hardware/interfaces" remote="github" revision="lineage-17.1" />
        </manifest>
        EOF

    - name: 6. Синхронизация кода (Умный перезапуск при сбоях сети)
      run: |
        cd $HOME/android
        for i in {1..5}; do repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags && break || sleep 20; done

    - name: 7. Пре-компиляционные фиксы (Vanilla, Оптимизация под SDM712 и Верификация версии)
      run: |
        cd $HOME/android/device/realme/spy
        echo "TARGET_GAPPS_ARCH := arm64" >> BoardConfig.mk
        echo "WITH_GAPPS := false" >> BoardConfig.mk
        echo "TARGET_CPU_VARIANT := kryo300" >> BoardConfig.mk
        
        cd $HOME/android/vendor/crdroid
        find . -type f -name "*.mk" -exec sed -i 's/CRDROID_VERSION := 6.*/CRDROID_VERSION := 6.30/g' {} +
        echo "PRODUCT_PROPERTY_OVERRIDES += ro.crdroid.version=6.30" >> config/common.mk

    - name: 8. Интеллектуальный цикл компиляции и Самоисцеление кода (Self-Healing)
      run: |
        cd $HOME/android
        export CCACHE_EXEC=/usr/bin/ccache
        export USE_CCACHE=1
        ccache -M 50G
        
        # Переменные совместимости
        export CLANG_ALLOW_UNKNOWN_FLAGS=true
        export Common_global_cflags="-Wno-error"
        
        echo "=== ИНИЦИАЛИЗАЦИЯ СРЕДЫ ==="
        source build/envsetup.sh > init_env.log 2>&1
        lunch crdroid_spy-userdebug >> init_env.log 2>&1 || echo "LUNCH_FAILED=true" >> init_env.log
        
        # Динамическая замена бинарных зависимостей инструментов сборки Google AOSP
        find prebuilts/ -type f -executable -exec sh -c 'patchelf --replace-needed libncurses.so.5 libncurses.so.6 "$1" 2>/dev/null' _ {} \; || true
        
        echo "=== СТАРТ УМНОЙ СБОРКИ ==="
        mka bacon -j$(nproc --all) > build.log 2>&1 || BUILD_FAILED=true
        
        if [ "$BUILD_FAILED" = true ]; then
          echo "⚠️ Обнаружен критический баг компиляции. Робот применяет комплексные низкоуровневые фиксы..."
          
          find $HOME/android/device/realme/spy -name "*.mk" -exec sed -i 's/-Werror/-Wno-error/g' {} +
          find $HOME/android/kernel/realme/sdm710 -name "Makefile" -exec sed -i 's/-Werror/-Wno-error/g' {} +
          find $HOME/android/hardware/interfaces -name "*.bp" -exec sed -i 's/minus_werror: false/minus_werror: true/g' {} +
          
          if grep -q "was not declared in this scope" build.log || grep -q "unknown type name" build.log; then
             echo "🤖 Фиксим заголовочные файлы: инжектим базовые системные типы Linux"
             find $HOME/android/kernel/realme/sdm710 -name "*.h" -exec sed -i '1s/^/#include <linux/types.h>\n#include <stdint.h>\n/' {} +
          fi
          
          find $HOME/android/system/tools -name "*.cc" -exec sed -i 's/int yy_flex_alloc/void* yy_flex_alloc/g' {} + 2>/dev/null || true

          echo "🔄 Патчи успешно применены к исходникам LineageOS. Запуск повторной горячей компиляции..."
          mka bacon -j$(nproc --all) > build.log 2>&1
        fi

    - name: 9. Выгрузка итоговых файлов сборки (.zip прошивка и образы .img)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: crDroid-6.30-Output-Artifacts
        path: |
          /home/runner/android/out/target/product/spy/crDroid*.zip
          /home/runner/android/out/target/product/spy/recovery.img
          /home/runner/android/out/target/product/spy/boot.img

    - name: 10. Выгрузка полных системных логов компиляции для анализа ИИ
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: crDroid-6.30-Compilation-Logs
        path: |
          /home/runner/android/init_env.log
          /home/runner/android/build.log
