name: ROM Compiler Ultra (crDroid 6 - RMX1971)

on:
  workflow_dispatch: # Ручной запуск из интерфейса GitHub

jobs:
  compile:
    runs-on: ubuntu-20.04
    steps:
    - name: Checkout Репозитория
      uses: actions/checkout@v3

    - name: Очистка дискового пространства виртуальной машины
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
        sudo apt-get clean
        df -h

    - name: Установка низкоуровневых утилит компиляции (Среда AOSP)
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.1-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 libncurses5

    - name: Настройка утилиты Google Repo
      run: |
        git config --global user.name "Lead Lowlevel Developer"
        git config --global user.email "core@kernel.android"
        mkdir -p ~/bin
        curl https://googleapis.com > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Инициализация репозитория исходного кода crDroid 6.x (Android 10)
      run: |
        mkdir ~/android
        cd ~/android
        repo init -u https://github.com -b 10.0 --git-lfs --depth=1

    - name: Генерация Локального Манифеста (Дерево устройств Realme 5 Pro)
      run: |
        mkdir -p ~/android/.repo/local_manifests
        cat <<EOF > ~/android/.repo/local_manifests/spy.xml
        <?xml version="1.0" encoding="UTF-8"?>
        <manifest>
          <remove-project name="LineageOS/android_device_qcom_sepolicy" />
          
          <!-- Device Tree RMX1971 -->
          <project name="LineageOS/android_device_realme_spy" path="device/realme/spy" remote="github" revision="lineage-17.1" />
          <project name="LineageOS/android_device_realme_sdm710-common" path="device/realme/sdm710-common" remote="github" revision="lineage-17.1" />
          
          <!-- Custom Kernel SDM712 -->
          <project name="LineageOS/android_kernel_realme_sdm710" path="kernel/realme/sdm710" remote="github" revision="lineage-17.1" />
          
          <!-- Vendor Blobs (Вместо сбойного zip-архива) -->
          <project name="TheMuppets/proprietary_vendor_realme" path="vendor/realme" remote="github" revision="lineage-17.1" />
          
          <project name="LineageOS/android_hardware_interfaces" path="hardware/interfaces" remote="github" revision="lineage-17.1" />
        </manifest>
        EOF

    - name: Синхронизация исходного кода (Repo Sync)
      run: |
        cd ~/android
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Тонкая низкоуровневая настройка (Vanilla-конфиг и Оптимизация Kryo 360)
      run: |
        cd ~/android/device/realme/spy
        # Принудительное отключение GApps для чистой Vanilla
        echo "TARGET_GAPPS_ARCH := arm64" >> BoardConfig.mk
        echo "WITH_GAPPS := false" >> BoardConfig.mk
        # Оптимизация под ядра процессора Snapdragon 712
        echo "TARGET_CPU_VARIANT := kryo300" >> BoardConfig.mk

    - name: Компиляция Ядра, Рекавери и Прошивки
      run: |
        cd ~/android
        export CCACHE_EXEC=/usr/bin/ccache
        export USE_CCACHE=1
        ccache -M 50G
        
        # Запуск среды сборки Android
        source build/envsetup.sh
        
        # Выбор цели сборки для Realme 5 Pro (spy)
        lunch crdroid_spy-userdebug
        
        # Сборка финального пакета прошивки и образов .img
        mka bacon -j$(nproc --all)

    - name: Выгрузка готовых файлов сборки (.zip прошивка и .img ядра/рекавери)
      uses: actions/upload-artifact@v3
      with:
        name: crDroid-6-RMX1971-Vanilla-Build
        path: |
          ~/android/out/target/product/spy/crDroid*.zip
          ~/android/out/target/product/spy/recovery.img
          ~/android/out/target/product/spy/boot.img
